[project]
name = "sonus"
version = "0.1.0"
description = "Linux driver and PyQt6 control app for the Sony WH-1000XM6"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyqt6>=6.7",
    "pyqt6-webengine>=6.7",
]

[project.scripts]
sonus = "sonus.cli.main:main"
sonus-gui = "sonus.gui.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
markers = [
    "hardware: requires a connected WH-1000XM6 (run with -m hardware)",
]
addopts = "-m \"not hardware\""
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sonus"]
